name: bump-cask
# Called from the main repo's release workflow:
#   gh workflow run bump.yml -R orioshavfx/homebrew-veil -f version=1.0.0 -f sha256=<hash>
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v"
        required: true
      sha256:
        description: "sha256 of Veil.zip"
        required: true
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]
          [[ "${{ inputs.sha256 }}" =~ ^[0-9a-f]{64}$ ]]
      - name: Update cask
        run: |
          sed -i -E 's/^(  version ").*(")$/\1${{ inputs.version }}\2/' Casks/veil.rb
          sed -i -E 's/^(  sha256 ").*(")$/\1${{ inputs.sha256 }}\2/' Casks/veil.rb
      - name: Commit
        run: |
          git config user.name "veil-release"
          git config user.email "veil-release@users.noreply.github.com"
          git add Casks/veil.rb
          git diff --cached --quiet || git commit -m "veil ${{ inputs.version }}"
          git push
